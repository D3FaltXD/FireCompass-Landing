<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login | Library For All</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Montserrat, sans-serif;
            background: #f8fafc
        }

        .bg-lfa-teal {
            background: #00B2A9
        }

        .text-lfa-teal {
            color: #00B2A9
        }

        .bg-lfa-orange {
            background: #F26522
        }

        .hover-lfa-teal:hover {
            background: #00968F
        }

        .border-lfa-teal {
            border-color: #00B2A9
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="mb-8 text-center"><svg width="60" height="60" viewBox="0 0 100 100" class="mx-auto mb-4">
            <circle cx="50" cy="50" r="48" fill="#00B2A9" />
            <path d="M30 70V30H40V60H65V70H30Z" fill="#fff" />
            <rect x="55" y="30" width="15" height="15" rx="2" fill="#F26522" />
        </svg>
        <h1 class="text-2xl font-bold text-gray-800">Library For All</h1>
        <p class="text-sm text-gray-500 uppercase tracking-widest font-semibold">Knowledge is for everyone</p>
    </div>
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border overflow-hidden">
        <div class="h-2 bg-lfa-orange"></div>
        <div class="p-8">
            <h2 class="text-xl font-bold text-center mb-6">Sign in to your account</h2>
            <form id="loginForm" class="space-y-5"><input id="email" type="email" required placeholder="you@example.com"
                    class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-lfa-teal outline-none"><input
                    id="password" type="password" required placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-lfa-teal outline-none"><label
                    class="flex items-center text-sm text-gray-600"><input type="checkbox" class="mr-2">Remember this
                    device</label><button
                    class="w-full bg-lfa-teal text-white font-bold py-3.5 rounded-xl hover-lfa-teal">Sign In</button>
            </form>
        </div>
    </div>
    <footer class="mt-12 text-xs text-gray-400 text-center">&copy; 2024 Library For All</footer>
    <script>document.getElementById("loginForm").onsubmit = e => { e.preventDefault(); let b = e.target.querySelector("button"); b.innerText = "Signing in..."; b.disabled = 1; setTimeout(() => { b.innerText = "Sign In"; b.disabled = 0 }, 1e3) }</script>
</body>

</html>
