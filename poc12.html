<!doctype html>
<html lang=en>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Login | Library For All</title>
<script src=https://cdn.tailwindcss.com></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel=stylesheet>
<style>
    * {
        font-family: Montserrat
    }

    body {
        background: #f8fafc
    }

    .t {
        background: #00B2A9
    }

    .o {
        background: #F26522
    }

    .h:hover {
        background: #00968F
    }
</style>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class=text-center><svg width=60 height=60 viewBox="0 0 100 100" class=mx-auto>
            <circle cx=50 cy=50 r=48 fill=#00B2A9></circle>
            <path d="M30 70V30H40V60H65V70H30Z" fill=#fff></path>
            <rect x=55 y=30 width=15 height=15 rx=2 fill=#F26522></rect>
        </svg>
        <h1 class="text-2xl font-bold">Library For All</h1>
        <p class="text-xs uppercase tracking-widest">Knowledge is for everyone</p>
        <div class="mt-6 max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="h-2 o"></div>
            <form id=f class="p-6 space-y-4"><input required type=email placeholder=Email
                    class="w-full p-3 border rounded-xl"><input required type=password placeholder=Password
                    class="w-full p-3 border rounded-xl"><button
                    class="w-full t h text-white font-bold py-3 rounded-xl">Sign In</button></form>
        </div>
    </div>
    <script>f.onsubmit = e => { e.preventDefault(); let b = f.querySelector("button"); b.textContent = "Signing in..."; setTimeout(() => b.textContent = "Sign In", 1e3) }</script>
